name: Custom.Windows.Triage.Persistence
description: |
  Windows persistence in one view: Run/RunOnce keys, the per-user and machine
  Startup folders, and the Winlogon values an attacker edits to run code at
  logon. Read-only. Every row carries the registry key or file and its raw value,
  so a triager can decide what is legitimate instead of trusting a verdict.

author: Youssef Bouaouina
parameters:
  - name: RunKeys
    description: Comma-separated registry globs for the Run and RunOnce keys.
    default: 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run\*,HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce\*,HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run\*,HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce\*,HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\*'
  - name: StartupFolders
    description: Comma-separated file globs for the Startup folders.
    default: 'C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\*,C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\*'
  - name: WinlogonKeys
    description: Comma-separated registry globs for the Winlogon key.
    default: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\*'

sources:
  - name: RunKeys
    query: |
      SELECT "RunKey" AS Source,
             OSPath AS Path,
             Name,
             Data.value AS Command
      FROM glob(globs=split(string=RunKeys, sep=","), accessor="registry")

  - name: StartupFolder
    query: |
      SELECT "StartupFolder" AS Source,
             OSPath AS Path,
             Name,
             Size,
             Mtime
      FROM glob(globs=split(string=StartupFolders, sep=","))

  - name: Winlogon
    query: |
      SELECT "Winlogon" AS Source,
             OSPath AS Path,
             Name,
             Data.value AS Command
      FROM glob(globs=split(string=WinlogonKeys, sep=","), accessor="registry")
      WHERE Name = "Userinit"
         OR Name = "Shell"
         OR Name = "Taskman"
         OR Name = "GinaDLL"
         OR Name = "AppInit_DLLs"
