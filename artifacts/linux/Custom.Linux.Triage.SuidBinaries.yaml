name: Custom.Linux.Triage.SuidBinaries
description: |
  Set-user-ID binaries outside the standard system directories. A SUID binary
  owned by root is a direct privilege-escalation path; the interesting rows are
  the ones in /tmp, /home, /opt and /var, not /usr/bin/passwd.

  The scan uses find with -xdev, so it does not cross into mounted filesystems.
  Set Root to scan a mounted image or a single directory instead of the
  standard list.

author: Youssef Bouaouina
parameters:
  - name: Root
    description: Optional single directory to scan. Empty means the standard directories.
    default: ''
  - name: StandardDirs
    description: Directories scanned when Root is empty.
    default: '/usr/bin /usr/sbin /bin /sbin /usr/local/bin /usr/local/sbin /opt /tmp /var/tmp /home'

sources:
  - query: |
      LET target = if(condition=Root != "", then=Root, else=StandardDirs)
      SELECT "find" AS Method,
             target AS Root,
             split(string=Stdout, sep="\n") AS SuidFiles
      FROM execve(argv=["bash", "-c", "find " + target + " -xdev -perm -4000 -type f 2>/dev/null"])
